<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synack Targets Dashboard v2.2+</title> <link rel="stylesheet" href="styles.css">
    <script src="marked.min.js"></script>
</head>
<body>
    <div class="controls-container">
         <h2>Synack Target Dashboard v2.2+</h2>
         <div class="controls-row token-row">
              <label for="token">Auth Token:</label>
             <input type="text" id="token" placeholder="Enter Synack Bearer Token">
             </div>
         <div class="controls-row main-actions-row">
             <button onclick="fetchData()" title="Fetch currently registered targets table">Load Target Table</button>
             <input type="text" id="search" class="search-box" placeholder="Search loaded targets...">
             <button id="registerTargetsBtn" onclick="registerAllTargets()" title="Register available targets you qualify for (checks first page)">Register Available</button>
             <button id="themeToggleBtn" title="Toggle Dark/Light Mode" style="margin-left: auto;">Toggle Theme</button>
         </div>
         <div id="registrationLogContainer"></div>
        </div>

    <div class="main-layout">
        <div class="table-pane">
             <div class="table-filters-container">
                 <div class="column-filter" id="columnFilterControls"><strong>Show Columns:</strong></div>
                 <div class="view-filter" id="viewFilterControls">
                     <button data-view-type="all" class="active-filter">All</button>
                     <button data-view-type="favorites">Favorites</button>
                     <button data-view-type="hidden">Hidden</button>
                 </div>
             </div>
             <div class="table-wrapper"><table id="targetTable"><thead><tr></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="details-pane" id="detailsPane">
             <div id="paneContent"><div class="status-message">Select a target's details or analytics to view them here.</div></div>
        </div>
    </div>

    <script src="main.js" defer></script>
</body>
</html>
